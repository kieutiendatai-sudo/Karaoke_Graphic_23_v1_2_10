<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karaoke Overlay</title>
<link rel="stylesheet" href="css/overlay.css"></head>
<body>
<header><h1>Karaoke <em>Overlay</em></h1><p>SRT → ASS → FFmpeg → một clip overlay trong suốt · Premiere 23</p></header>
<div id="env" class="notice"></div>
<section><h2>1 · Tệp</h2>
<label>Thư mục FFmpeg (chứa ffmpeg.exe)<div class="row"><input id="ffmpegDir" placeholder="trống = dùng PATH hoặc thư mục bin của panel"><button data-pick="ffmpegDir" data-kind="dir">…</button></div></label>
<label>File SRT (mỗi dòng một file hoặc một thư mục)<textarea id="srtPath" rows="3" placeholder="Dán đường dẫn, hoặc dùng 2 nút bên dưới"></textarea></label>
<div class="grid"><button id="addSrtFiles">+ Chọn nhiều file SRT</button><button id="addSrtDir">+ Chọn thư mục SRT</button></div>
<label>Thư mục kết quả (trống = lưu cạnh từng file SRT)<div class="row"><input id="outputDir"><button data-pick="outputDir" data-kind="dir">…</button></div></label>
<button id="checkFfmpeg">Kiểm tra FFmpeg</button>
</section>
<section><h2>2 · Kiểu chữ (một dòng)</h2><div class="grid">
<label>Font đã cài trong máy<div class="row"><select id="systemFont"><option value="">— bấm ⟳ để quét font hệ thống —</option></select><button id="scanFonts" title="Quét font hệ thống">⟳</button></div></label>
<label>File font (.ttf/.otf)<div class="row"><input id="fontFile"><button data-pick="fontFile" data-kind="file">…</button></div></label>
<label>Cỡ chữ (px)<input id="fontSize" type="number" min="8" max="400"></label>
<label class="check"><input id="bold" type="checkbox">In đậm (nếu font chưa đậm)</label>
<label>Căn ngang<select id="align"><option value="center">Giữa</option><option value="left">Trái</option><option value="right">Phải</option></select></label>
<label>Màu chữ chưa đọc<div class="row"><input id="textColor" class="hex" maxlength="7" placeholder="#RRGGBB" spellcheck="false"><i class="sw" data-for="textColor"></i></div></label>
<label>Màu từ đang đọc<div class="row"><input id="highlightColor" class="hex" maxlength="7" placeholder="#RRGGBB" spellcheck="false"><i class="sw" data-for="highlightColor"></i></div></label>
<label>Màu viền<div class="row"><input id="outlineColor" class="hex" maxlength="7" placeholder="#RRGGBB" spellcheck="false"><i class="sw" data-for="outlineColor"></i></div></label>
<label>Độ dày viền<input id="outline" type="number" step="0.1" min="0" max="20"></label>
<label>Bóng<input id="shadow" type="number" step="0.1" min="0" max="20"></label>
<label class="check"><input id="bgEnabled" type="checkbox">Bật màu nền sau chữ</label>
<label>Màu nền<div class="row"><input id="bgColor" class="hex" maxlength="7" placeholder="#RRGGBB" spellcheck="false"><i class="sw" data-for="bgColor"></i></div></label>
<label>Độ đục nền (%)<input id="bgOpacity" type="number" min="0" max="100" step="5"></label>
<label>Đệm quanh chữ (px)<input id="bgPadding" type="number" min="0" max="80" step="1"></label>
<label>Điểm neo X (% chiều rộng)<input id="anchorX" type="number" min="0" max="100" step="0.5"></label>
<label>Vị trí Y (% chiều cao khung)<input id="yPercent" type="number" min="0" max="100" step="0.5"></label>
<label>Cao dải phụ đề (px, 0 = tự động)<input id="canvasHeight" type="number" min="0" step="2"></label>
</div></section>
<section><h2>3 · Khung hình / thời gian</h2><div class="grid">
<label>FPS<select id="fps"><option value="auto">Theo sequence</option><option>23.976</option><option>24</option><option>25</option><option>29.97</option><option>30</option><option>50</option><option>59.94</option><option>60</option></select></label>
<label>Rộng (px, 0 = theo sequence)<input id="width" type="number" min="0" step="2"></label>
<label>Offset SRT (giây)<input id="offset" type="number" step="0.001"></label>
<label>Codec<select id="codec"><option value="prores4444">ProRes 4444 (alpha)</option><option value="qtrle">Animation qtrle (alpha, nhỏ hơn)</option></select></label>
</div></section>
<section><h2>4 · Chạy</h2>
<div class="grid"><label>Xem thử từ giây<input id="previewStart" type="number" step="0.5" min="0"></label><label>Dài (giây)<input id="previewLength" type="number" step="0.5" min="1"></label></div>
<div class="grid"><button id="preview">Xem thử (render ngắn)</button><button id="render" class="primary">Render overlay</button></div>
<div class="grid"><label>Chèn vào track V<input id="insertTrack" type="number" min="1"></label><label>Lệch thời gian chèn (giây)<input id="insertOffset" type="number" step="0.001"></label></div>
<label class="check"><input id="insertIntoTimeline" type="checkbox">Chèn clip vào timeline (tắt: chỉ nhập vào Project)</label>
<label>Nhập cho SRT (mỗi SRT một sequence: mở sequence rồi chọn SRT tương ứng)<select id="importSrt"></select></label>
<div class="grid"><button id="import" class="primary">Nhập vào Premiere</button><button id="stop">Dừng</button></div>
<button id="openFolder">Mở thư mục kết quả</button>
<progress id="progress" max="1" value="0"></progress>
</section>
<section><h2>Nhật ký</h2><pre id="log"></pre></section>
<script src="js/overlay/overlay-panel.js"></script>
</body></html>
